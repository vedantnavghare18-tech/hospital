<!DOCTYPE html>
<html>

<head>

    <title>Treatment & Cost</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <h2>🏥 Hospital Analytics</h2>

    <a href="/">Dashboard</a>
    <a href="/patient">Patient Search</a>
    <a href="/condition">Condition Analysis</a>
    <a href="/treatment">Treatment & Cost</a>
    <a href="/outcome">Outcome & Readmission</a>

</nav>


<div class="container">

    <h1>💰 Treatment & Cost Analysis</h1>


    <form>

        <input
            type="text"
            name="search"
            placeholder="Search procedure"
            value="{{ search }}"
        >

        <button type="submit">
            Search
        </button>

    </form>


    <table>

        <tr>

            <th>Procedure</th>
            <th>Average Cost</th>
            <th>Average Stay</th>

        </tr>


        {% for row in records %}

        <tr>

            <td>{{ row["Procedure"] }}</td>

            <td>${{ row["Average_Cost"] }}</td>

            <td>{{ row["Average_Stay"] }} days</td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>

</html>
